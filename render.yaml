# Render deployment for Kaarigar.
#
# HANDOFF ARTIFACT: prepared by Track A, owned and executed by Track C.
# Nothing here deploys on its own - C connects the repo in the Render dashboard,
# Render reads this file, and C sets the secret values (see envVars below).
#
# Deploying satisfies a dependency of three later days:
#   - Day 2: the QR must encode a reachable /p/:handle URL, not localhost
#   - Day 2: Firebase authorized-domains needs this origin to exist
#   - Day 6: the second-phone scan test cannot run against a local dev server
#
# Day 9's "deploy" then becomes a REDEPLOY of a target live since Day 1, which
# is the far safer shape - the first deploy of a project should never happen the
# day before a freeze.

services:
  - type: web
    name: kaarigar
    runtime: node
    plan: free

    # Singapore is Render's closest free region to the Atlas cluster in Mumbai
    # (ap-south-1). On Oregon every database query crosses two oceans:
    # India -> US -> Mumbai and back, on every request, during a live demo.
    region: singapore

    # --include=dev is REQUIRED and is not a style choice. Render sets
    # NODE_ENV=production, under which plain `npm ci` omits devDependencies -
    # and esbuild, tailwindcss and typescript all live there while being needed
    # at build time. Without this flag the build fails with a confusing
    # "esbuild: not found" that looks like a broken lockfile.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # The server binds 0.0.0.0 and reads process.env.PORT, which Render injects.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Pin the major version. Without this Render picks its own default, which
      # can move under you between deploys.
      - key: NODE_VERSION
        value: "22"

      # sync: false means "prompt me, do not store in the repo". Set these in
      # the Render dashboard under Environment. They are the same values from
      # .env - see .env.example for what each one is.
      #
      # JWT_SECRET MUST BE BYTE-IDENTICAL to the local one. If it is not,
      # tokens issued locally fail verification here and vice versa, and the
      # symptom is a 401 that reads as a bug in requireAuth. Copy it; do not
      # regenerate it here.
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      # Keep the rehearsal isolated from any default/production database.
      # The demo seed scripts and DEMO_RUNBOOK.md use this exact database name.
      - key: MONGODB_DB_NAME
        value: kaarigar_sih_demo
      - key: GEMINI_API_KEY
        sync: false
      - key: REVIEW_LINK_SECRET
        sync: false

      # Pin every printed QR and signed customer-review link to the demo origin.
      - key: PUBLIC_ORIGIN
        value: https://kaarigar.onrender.com

      # Stage-only login fallback. Render prompts for these values rather than
      # storing them in source. All three must be configured for the bypass to
      # activate, and the server scopes it to the one demo phone.
      - key: DEMO_OTP_ENABLED
        sync: false
      - key: DEMO_OTP_PHONE
        sync: false
      - key: DEMO_OTP_CODE
        sync: false

      # Firebase web config. Not secret - these ship in the browser bundle by
      # design - but Vite inlines them at BUILD time, so they must be present
      # here for the client to see them, not just at runtime.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

      # --- Client build-time vars actually read by the bundle today ---
      #
      # Both are inlined by Vite at BUILD time, not read at runtime. Changing
      # either one in the Render dashboard therefore requires a REDEPLOY, not a
      # restart. A restart leaves the old value compiled into the JS and the
      # change appears to have been ignored.

      # VITE_DEMO_TOKEN IS GONE. It was a 12-hour bearer token for the seeded
      # demo worker, compiled into the browser bundle so the voice flow worked
      # before login existed. AuthProvider replaced it. Do not reintroduce it:
      # a 401 now means "sign in", not "ship a credential".

      # VITE_USE_API: per-screen data source switch (src/lib/featureFlags.ts),
      # mapped onto App's three state slices by src/lib/dataSource.ts.
      #
      # SET TO "all" - AND THIS IS THE DAY 9 DECISION, RECORDED HERE.
      #
      # It is a declared value rather than sync:false on purpose. A dashboard-
      # only setting is invisible to everyone who reads this repository, and
      # "which screens are on the API in the demo build" is a question the team
      # must be able to answer by reading the source rather than by asking
      # whoever last opened Render. The runbook requirement is that the answer
      # is recorded; this is the recording.
      #
      # "all" rather than a subset because a subset is not the smaller step it
      # looks like: the dashboard reads all three data domains, so any flag that
      # includes `home` pulls all three anyway. See dataSource.ts.
      #
      # RUNNING THE DEMO CONFIG DAILY IS THE POINT. Every day the deploy runs a
      # configuration we do not intend to present is a day of untested risk
      # banked against the one morning it cannot be spent.
      #
      # Vite inlines this at BUILD time. Changing it needs a REDEPLOY, not a
      # restart - a restart leaves the old value compiled into the JS and looks
      # exactly like the change was ignored.
      - key: VITE_USE_API
        value: all
